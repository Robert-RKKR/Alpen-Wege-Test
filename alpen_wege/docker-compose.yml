services:
  postgres:
    image: postgis/postgis:15-3.4
    container_name: alpen-postgres
    environment:
      POSTGRES_DB: alpenwege
      POSTGRES_USER: alpenwege
      POSTGRES_PASSWORD: alpenwege
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alpenwege -d alpenwege"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: alpen-redis
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpen-api
    environment:
      DATABASE_URL: postgresql+asyncpg://alpenwege:alpenwege@postgres:5432/alpenwege
      DATABASE_URL_SYNC: postgresql+psycopg2://alpenwege:alpenwege@postgres:5432/alpenwege
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-dev-secret-change-in-prod}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app

  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alpen-celery
    environment:
      DATABASE_URL: postgresql+asyncpg://alpenwege:alpenwege@postgres:5432/alpenwege
      DATABASE_URL_SYNC: postgresql+psycopg2://alpenwege:alpenwege@postgres:5432/alpenwege
      REDIS_URL: redis://redis:6379/2
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker.celery_app worker --loglevel=info --beat

volumes:
  pgdata:
  redisdata:
